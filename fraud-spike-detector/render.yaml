services:
  - type: web
    name: sentinelrisk-ai-dashboard
    env: docker
    dockerfilePath: Dockerfile
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: 8501
      - key: PYTHONUNBUFFERED
        value: 1
